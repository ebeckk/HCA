<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1e3a5f;
      --accent: #1a73e8;
      --accent-h: #1558c0;
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --font: 'Roboto', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .workflow-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
    }

    .workflow-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .workflow-icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 0.75rem;
    }

    .workflow-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }

    .workflow-header p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .step-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .workflow-btn {
      flex: 1;
      padding: 14px 18px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color .2s, background .2s, color .2s;
      line-height: 1.4;
    }

    .workflow-btn:hover {
      border-color: var(--accent);
      background: #e8f0fe;
      color: var(--accent);
    }

    .workflow-btn .btn-subtitle {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }

    .workflow-btn:hover .btn-subtitle { color: var(--accent); }
  </style>
</head>
<body>
  <div class="workflow-card">
    <div class="workflow-header">
      <span class="workflow-icon">📋</span>
      <h1>Study Workflow</h1>
      <p>Please complete the following steps in order.</p>
    </div>

    <ol class="step-list">
      <li class="step-item">
        <div class="step-number">1</div>
        <button id="survey-btn" class="workflow-btn">
          Complete the demographics questionnaire
          <span class="btn-subtitle">Opens a short survey in Qualtrics</span>
        </button>
      </li>
      <li class="step-item">
        <div class="step-number">2</div>
        <button id="task-btn" class="workflow-btn" type="button">
          Read the task
          <span class="btn-subtitle">Review what you'll be asked to do</span>
        </button>
      </li>
      <li class="step-item">
        <div class="step-number">3</div>
        <button id="prototype-btn" class="workflow-btn" type="button">
          Use the AI system to complete the task
          <span class="btn-subtitle">Opens the chatbot for your assigned system</span>
        </button>
      </li>
    </ol>
  </div>

  <script src="script.js"></script>
</body>
</html>
